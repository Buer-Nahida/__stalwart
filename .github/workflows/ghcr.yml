name: Build and publish Stalwart

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: stalwart-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/powershell
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (upstream Dockerfile, Full LTO)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/buer-nahida/stalwart:ip-literal
            ghcr.io/buer-nahida/stalwart:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Buer-Nahida/__stalwart
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=stalwart
          cache-to: type=gha,scope=stalwart,mode=max
